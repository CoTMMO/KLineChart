<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="kline time-line candlestick stock chart canvas k线 行情 蜡烛图 分时图 技术指标 图表"/>
    <meta name="description" content="zigzag line test"/>
    <script type="text/javascript" src="../../../dist/klinecharts.min.js"></script>
    <script type="text/javascript" src="../../js/dataSource.js"></script>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Zigzag Line Overlay Test</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="chart"></div>
    <div style="margin: 20px;">
      <h3>Zigzag Line Overlay Test</h3>
      <p>This test demonstrates the zigzag line overlay with swing size labels.</p>
      <p>Features:</p>
      <ul>
        <li>Automatic zigzag line drawing based on price deviation</li>
        <li>Swing size labels at pivot points</li>
        <li>Point labels (X, A, B, C, D...)</li>
        <li>Customizable deviation threshold</li>
      </ul>
      <button onclick="addZigzag()">Add Zigzag Line</button>
      <button onclick="clearOverlays()">Clear All Overlays</button>
    </div>
    <script>
      let chart;
      
      window.onload = function () {
        chart = klinecharts.init('chart')
        chart.createIndicator('EMA')
        chart.applyNewData(generated())
        
        // Add zigzag line automatically
        addZigzag();
      }
      
      function addZigzag() {
        // Create zigzag line overlay
        chart.createOverlay('zigzagLine', {
          extendData: {
            config: {
              deviation: 0.5, // 0.5% deviation
              showSwingSize: true,
              showLabels: true,
              lineColor: '#FFFFFF',
              lineWidth: 2,
              labelColor: '#FFFF00',
              labelSize: 12
            }
          }
        })
      }
      
      function clearOverlays() {
        chart.removeOverlay()
      }
    </script>
  </body>
</html>
